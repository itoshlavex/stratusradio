name: APK

# Builds and signs the Android app, then puts it where the site serves it
# (https://stratusradio.app/download/stratusradio.apk).
#
# Run from the Actions tab. Nothing here happens on a push: the APK is a shell
# around the deployed site, so a change to the stations or the player reaches
# installed phones through a normal deploy and only the icon, the name or a
# version bump is a reason to build a new one.
#
# The signing key lives in Actions secrets rather than in the repository - a
# file committed to git is in every clone of it forever, and this key cannot be
# rotated: Android takes an update only if it carries the same signature as the
# build already on the phone.
on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Version people see, e.g. 1.0.2"
        required: true
        type: string

concurrency:
  group: apk-main
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      # Commits the built APK back to main. Cloudflare deploys it from there.
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci

      - name: Restore the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ANDROID_KEYSTORE_BASE64 is not set - an unsigned APK installs nowhere." >&2
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/keys/stratusradio-release.jks"
          # Written on the runner, never committed. build.gradle reads the path
          # out of this variable rather than the default under the home
          # directory.
          {
            echo "storeFile=$RUNNER_TEMP/keys/stratusradio-release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=stratusradio"
            echo "keyPassword=$KEYSTORE_PASSWORD"
          } > "$RUNNER_TEMP/keys/keystore.properties"
          echo "STRATUS_KEYSTORE_PROPERTIES=$RUNNER_TEMP/keys/keystore.properties" >> "$GITHUB_ENV"

      - name: Set the version
        # The input goes through the environment rather than straight into the
        # script, so a version string cannot become a shell command.
        env:
          VERSION_NAME: ${{ inputs.version_name }}
        run: |
          current=$(grep -oP 'versionCode \K\d+' android/app/build.gradle)
          next=$((current + 1))
          # versionCode counts up on its own. It is what Android compares, and
          # an update whose code is not higher than the installed build's is
          # refused, so it is not left to whoever runs this to remember.
          sed -i "s/versionCode $current/versionCode $next/" android/app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"$VERSION_NAME\"/" android/app/build.gradle
          echo "APK_VERSION_CODE=$next" >> "$GITHUB_ENV"
          echo "Building $VERSION_NAME, versionCode $next."

      - name: Build
        run: npm run apk

      - name: Check it is signed with the Stratus Radio key
        # Any other certificate would not install over the app people already have.
        run: |
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$apksigner" verify --print-certs download/stratusradio.apk | tee certs.txt
          grep -q "SHA-256 digest: e758709f2c454d5a5d5aac8d110101cf41930b082c93a57d73a8b548c27bf3e9" certs.txt

      # Kept on the run itself as well as committed, so the file can be
      # downloaded straight away without waiting for the deploy.
      - uses: actions/upload-artifact@v4
        with:
          name: stratusradio-apk
          path: download/stratusradio.apk

      - name: Commit it
        env:
          VERSION_NAME: ${{ inputs.version_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android/app/build.gradle download/stratusradio.apk
          git commit -m "Build Stratus Radio $VERSION_NAME for Android" \
            -m "versionCode $APK_VERSION_CODE, built and signed by the APK workflow."
          git push

      - name: Summary
        env:
          VERSION_NAME: ${{ inputs.version_name }}
        run: |
          {
            echo "### Stratus Radio $VERSION_NAME built"
            echo
            echo "versionCode $APK_VERSION_CODE, committed to \`main\`. Cloudflare deploys it from there."
            echo
            echo "It will be at https://stratusradio.app/download/stratusradio.apk in a minute or two."
          } >> "$GITHUB_STEP_SUMMARY"
