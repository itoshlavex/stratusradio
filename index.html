<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<base href="/">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Stratus Radio</title>
<meta name="description" content="Live radio from across the Pacific: Papua New Guinea, Fiji, Samoa, Tonga, Vanuatu, Tahiti, Guam, New Zealand and more.">
<link rel="canonical" href="https://stratusradio.ololiohill.io/">
<meta name="author" content="Ololio Hill Technologies">
<script type="application/ld+json">
{"@context": "https://schema.org", "@type": "WebApplication", "name": "Stratus Radio", "url": "https://stratusradio.ololiohill.io/",
 "applicationCategory": "MusicApplication", "operatingSystem": "Any",
 "description": "Live radio from across the Pacific.",
 "publisher": {"@type": "Organization", "name": "Ololio Hill Technologies", "url": "https://www.ololiohill.io/"}}
</script>
<meta property="og:type" content="website">
<meta property="og:site_name" content="Stratus Radio by Ololio Hill Technologies">
<meta property="og:title" content="Stratus Radio">
<meta property="og:description" content="Live radio from across the Pacific: Papua New Guinea, Fiji, Samoa, Tonga, Vanuatu, Tahiti, Guam, New Zealand and more. By Ololio Hill Technologies.">
<meta property="og:url" content="https://stratusradio.ololiohill.io/">
<meta property="og:image" content="https://stratusradio.ololiohill.io/icon-512.png">
<meta name="twitter:card" content="summary">
<meta name="theme-color" content="#021A4F">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Stratus Radio">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito+Sans:wght@400;600;700&display=swap">
<link rel="stylesheet" href="app.css">
<script>
  /* Apply a saved light/dark choice before the page draws, so it doesn't flash. */
  try { var t = JSON.parse(localStorage.getItem('stratus:theme')); if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); } catch (e) {}
</script>
</head>
<body>
<header class="top">
  <div class="top-inner">
    <img class="logo" src="logo.png" width="64" height="64" alt="">
    <div class="brand">
      <h1 class="wordmark" aria-label="Stratus Radio"><span class="w1">stratus</span><span class="w2">radio</span></h1>
      <p class="tagline">Live radio from across the Pacific</p>
    </div>
    <button class="theme-btn" id="theme-btn" type="button" aria-label="Switch between light and dark mode">
      <svg class="i-light" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 2.5v2.5M12 19v2.5M2.5 12H5M19 12h2.5M5.3 5.3l1.8 1.8M16.9 16.9l1.8 1.8M5.3 18.7l1.8-1.8M16.9 7.1l1.8-1.8" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg>
      <svg class="i-dark" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 14.2A7.5 7.5 0 0 1 9.8 5a7.5 7.5 0 1 0 9.2 9.2z" fill="currentColor"/><path d="M17.5 3.5l.6 1.4 1.4.6-1.4.6-.6 1.4-.6-1.4-1.4-.6 1.4-.6z" fill="currentColor"/></svg>
    </button>
  </div>
  <svg class="wave" viewBox="0 0 1440 48" preserveAspectRatio="none" aria-hidden="true" focusable="false">
    <path class="wave-back" d="M0,0H1440V30C1140,48 900,12 600,26C360,37 160,42 0,28Z"/>
    <path class="wave-front" d="M0,0H1440V14C1180,34 920,2 640,13C380,23 180,30 0,14Z"/>
  </svg>
</header>

<main class="wrap" id="main">
  <div class="tools">
    <label class="search" for="q">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M16 16l4.5 4.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg>
      <input id="q" type="search" placeholder="Search name, town, language" autocomplete="off" enterkeyhint="search">
      <span class="visually-hidden">Search stations</span>
    </label>
    <div class="chips" id="countries" role="group" aria-label="Choose a country"></div>
    <div class="chips chips-sub" id="chips" role="group" aria-label="Type of station"></div>
  </div>

  <p class="count" id="count" aria-live="polite"></p>
  <ul class="list" id="list"></ul>

  <div class="empty" id="empty" hidden>
    <p class="empty-title" id="empty-title">No stations match</p>
    <p class="empty-body" id="empty-body">Try another word, or clear the search.</p>
  </div>

  <footer class="credit">
    &copy; <span id="year">2026</span> <a href="https://www.ololiohill.io/" target="_blank" rel="noopener">Ololio Hill Technologies</a>
  </footer>

</main>

<div class="player" id="player" role="region" aria-label="Player">
  <div class="player-inner">
    <span class="tile tile-sm" id="p-tile" aria-hidden="true"></span>
    <div class="p-text">
      <p class="p-name" id="p-name">Pick a station</p>
      <p class="p-status" id="p-status" aria-live="polite">Tap any station to start listening</p>
    </div>
    <button class="icon-btn" id="sleep-btn" type="button" aria-label="Sleep timer" aria-haspopup="dialog">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="13" r="7.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 9v4l2.5 2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M3.5 6.5 6.5 3.8M20.5 6.5 17.5 3.8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <span class="sleep-left" id="sleep-left" hidden></span>
    </button>
    <button class="play-btn" id="play-btn" type="button" aria-label="Play" disabled>
      <svg class="i-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l11-6.5z" fill="currentColor"/></svg>
      <svg class="i-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z" fill="currentColor"/></svg>
      <span class="spinner" aria-hidden="true"></span>
    </button>
  </div>
  <p class="p-help" id="p-help" hidden></p>
</div>

<dialog class="sheet" id="sleep-sheet" aria-labelledby="sleep-h">
  <form method="dialog" class="sheet-inner">
    <div class="sheet-head">
      <div class="sheet-titles">
        <h2 class="sheet-h" id="sleep-h" tabindex="-1" autofocus>Sleep timer</h2>
        <p class="sheet-sub" id="sleep-sub">Stop the radio after</p>
      </div>
      <button type="submit" class="btn-outline sheet-close" value="close">Close</button>
    </div>
    <div class="sleep-grid" id="sleep-grid">
      <button type="button" data-min="15">15<small>min</small></button>
      <button type="button" data-min="30">30<small>min</small></button>
      <button type="button" data-min="45">45<small>min</small></button>
      <button type="button" data-min="60">1<small>hour</small></button>
      <button type="button" data-min="120">2<small>hours</small></button>
      <button type="button" id="sleep-custom-btn" aria-expanded="false" aria-controls="sleep-custom">Custom</button>
    </div>
    <div class="sleep-custom" id="sleep-custom" hidden>
      <label class="sleep-pick"><select id="custom-h" aria-label="Hours"></select><span>hours</span></label>
      <label class="sleep-pick"><select id="custom-m" aria-label="Minutes"></select><span>min</span></label>
      <button type="button" class="btn-fill" id="custom-start">Start</button>
    </div>
    <button type="button" class="btn-text sleep-off" id="sleep-off" hidden>Turn off timer</button>
  </form>
</dialog>

<p class="toast" id="toast" role="status" aria-live="polite" hidden></p>

<audio id="audio" preload="none"></audio>
<script src="stations.js"></script>
<script src="app.js"></script>
</body>
</html>
